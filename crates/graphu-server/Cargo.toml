[package]
name = "graphu-server"
version = "0.1.0"
edition = "2021"
description = "HTTP API for Graphu. A thin layer over graphu-core that also serves the built frontend."

[dependencies]
graphu-core = { path = "../graphu-core" }
graphu-ingest = { path = "../graphu-ingest" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
