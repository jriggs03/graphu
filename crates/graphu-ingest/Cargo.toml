[package]
name = "graphu-ingest"
version = "0.1.0"
edition = "2021"
description = "Turns an uploaded file into page text and grounded proposals: PDF, text, slides, images, audio."

[dependencies]
graphu-core = { path = "../graphu-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "process", "fs", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
